# Builds and pushes the three pre-built base images to ghcr.io.
# Run this manually when OS/runtime dependencies change, or it runs
# automatically on the first of each month to pick up security patches.
#
# Base images produced:
#   ghcr.io/<owner>/tompit-base-release:stable  – aspnet:7.0 + fonts + runtime deps
#   ghcr.io/<owner>/tompit-base-debug:stable    – sdk:7.0 + fonts + vsdbg
#   ghcr.io/<owner>/tompit-sdk:stable           – sdk:7.0 + npm (shared build stage)
#
# No secrets required beyond the automatic GITHUB_TOKEN.

name: Build Base Images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC on the 1st of every month

permissions:
  packages: write

jobs:
  build-base:
    name: Build and Push Base Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage base Dockerfiles and compose
        run: |
          cp .github/build/config/dockerfile.base.release  dockerfile.base.release
          cp .github/build/config/dockerfile.base.debug    dockerfile.base.debug
          cp .github/build/config/dockerfile.base.sdk      dockerfile.base.sdk
          cp .github/build/config/docker-compose.base.yaml docker-compose.base.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base images
        run: |
          BASE_REGISTRY="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          BASE_REGISTRY="$BASE_REGISTRY" docker buildx bake \
            -f docker-compose.base.yaml \
            --set "*.cache-from=type=gha" \
            --set "*.cache-to=type=gha,mode=max" \
            --push
